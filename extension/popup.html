<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AI Guard Dashboard</title>
    <style>
        body { font-family: 'Inter', -apple-system, sans-serif; background: #000; color: #fff; margin: 0; padding: 24px; width: 340px; box-sizing: border-box; }
        .header { display: flex; align-items: center; justify-content: center; margin-bottom: 30px; gap: 10px; }
        .header svg { width: 28px; height: 28px; stroke: #fff; }
        .header h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: -0.5px; }
        
        .card { background: #0a0a0a; border: 1px solid #222; border-radius: 16px; padding: 24px; margin-bottom: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); transition: transform 0.3s ease, border-color 0.3s; }
        .card:hover { transform: translateY(-2px); border-color: #444; }
        
        .status-container { display: flex; justify-content: space-between; align-items: center; }
        .status-label { font-weight: 600; font-size: 15px; color: #fff; transition: color 0.3s; }
        
        /* Premium Toggle Switch */
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #222; transition: .4s cubic-bezier(0.4, 0.0, 0.2, 1); border-radius: 30px; border: 1px solid #333; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: #888; transition: .4s cubic-bezier(0.4, 0.0, 0.2, 1); border-radius: 50%; }
        input:checked + .slider { background-color: #fff; border-color: #fff; }
        input:checked + .slider:before { transform: translateX(22px); background-color: #000; }
        
        .btn { width: 100%; padding: 14px; background: #0a0a0a; color: #fff; border: 1px solid #333; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.2s ease; }
        .btn:hover { background: #fff; color: #000; border-color: #fff; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255,255,255,0.2); }
        .btn svg { width: 18px; height: 18px; stroke: currentColor; transition: transform 0.3s ease; }
        .btn:hover svg { transform: rotate(90deg); }
        
        .footer { text-align: center; font-size: 12px; color: #555; margin-top: 24px; font-weight: 500; }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.2); }
            70% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }
        input:checked + .slider { animation: pulse 2s infinite; }
    </style>
</head>
<body>
    <div class="header">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
        <h1>AI Shield</h1>
    </div>
    
    <div class="card">
        <div class="status-container">
            <span id="status-label" class="status-label">Active Engine</span>
            <label class="switch">
                <input type="checkbox" id="guard-toggle" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>
    
    <button id="manage-rules-btn" class="btn">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        Configure Policies
    </button>
    
    <div class="footer">Zero-trust architecture.</div>
    <script src="popup.js"></script>
</body>
</html>
