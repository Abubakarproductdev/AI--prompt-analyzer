<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AI Shield - Engine Policies</title>
    <style>
        body { font-family: 'Inter', -apple-system, sans-serif; background: #000; color: #fff; margin: 0; padding: 40px; }
        .container { max-width: 950px; margin: 0 auto; }
        h1 { display: flex; align-items: center; gap: 12px; font-weight: 700; margin-bottom: 8px; }
        h1 svg { width: 32px; height: 32px; stroke: #fff; }
        p.subtitle { color: #888; margin-bottom: 40px; font-size: 15px; }
        
        .card { background: #0a0a0a; border: 1px solid #222; border-radius: 16px; padding: 32px; margin-bottom: 24px; transition: border-color 0.3s; }
        .card:hover { border-color: #333; }
        h2 { margin-top: 0; font-size: 18px; font-weight: 600; margin-bottom: 24px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 16px; table-layout: fixed; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #222; vertical-align: middle; }
        th { color: #888; font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        td { font-size: 13px; }
        
        th:nth-child(1) { width: 11%; }
        th:nth-child(2) { width: 16%; }
        th:nth-child(3) { width: 16%; }
        th:nth-child(4) { width: 33%; }
        th:nth-child(5) { width: 8%; }
        th:nth-child(6) { width: 16%; }
        
        .code { font-family: 'JetBrains Mono', monospace; background: #000; padding: 6px 8px; border-radius: 6px; color: #ccc; font-size: 11px; border: 1px solid #222; display: block; word-break: break-all; white-space: pre-wrap; }
        
        .btn { background: #fff; color: #000; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; transition: all 0.2s; white-space: nowrap; }
        .btn:hover { background: #ccc; transform: translateY(-1px); }
        .btn-outline { background: transparent; color: #fff; border: 1px solid #333; }
        .btn-outline:hover { border-color: #fff; background: transparent; }
        .btn-danger { background: transparent; color: #ff4444; border: 1px solid #441111; }
        .btn-danger:hover { background: #ff4444; color: #fff; border-color: #ff4444; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; color: #aaa; font-size: 13px; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #000; color: white; box-sizing: border-box; font-family: inherit; transition: border-color 0.2s; }
        input:focus, select:focus { outline: none; border-color: #fff; }
        
        .flex { display: flex; gap: 20px; }
        .flex > * { flex: 1; }
        
        .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-active { border: 1px solid #fff; color: #fff; }
        .badge-inactive { border: 1px solid #333; color: #666; }
        .badge-active::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
            Engine Policies
        </h1>
        <p class="subtitle">Configure local detection rules. Changes apply instantly.</p>
        
        <div class="card">
            <h2>Compile Custom Rule</h2>
            <form id="add-rule-form">
                <div class="flex">
                    <div class="form-group">
                        <label>Threat Category</label>
                        <select id="rule-category" required>
                            <option value="PII & Internal Data">PII & Internal Data</option>
                            <option value="Credentials & Secrets">Credentials & Secrets</option>
                            <option value="Prompt Injection">Prompt Injection</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Signature Name</label>
                        <input type="text" id="rule-name" placeholder="e.g. Project Apollo Keyword" required>
                    </div>
                    <div class="form-group">
                        <label>Threat Weight (0-100)</label>
                        <input type="number" id="rule-weight" min="1" max="100" value="25" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Regex Pattern / Keyword</label>
                    <input type="text" id="rule-pattern" placeholder="e.g. (?i)\bProject Apollo\b" required>
                </div>
                <button type="submit" class="btn">Deploy Rule</button>
            </form>
        </div>

        <div class="card">
            <h2>Active Policy Signatures</h2>
            <table>
                <thead>
                    <tr>
                        <th>Status</th>
                        <th>Category</th>
                        <th>Signature Name</th>
                        <th>Pattern</th>
                        <th>Weight</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="rules-tbody">
                    <!-- Loaded dynamically -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="options.js"></script>
</body>
</html>
